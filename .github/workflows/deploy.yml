name: Deploy

# Publishes the React app and the Flask backend to one free Vercel project on
# every push to main. The backend runs as a Python function under /api, so the
# site needs no other host and no payment method.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://safe-stride-seven.vercel.app

jobs:
  deploy:
    name: Test and deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the required secrets
        run: |
          missing=""
          for name in VERCEL_TOKEN MONGO_URI SECRET_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are missing:$missing"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Restore the packed street graph
        id: graph-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/cache/oakland_walk.pkl.gz
          key: street-graph-${{ hashFiles('backend/street_graph.py', 'backend/routing.py', 'backend/requirements-build.txt') }}
      - name: Download and pack the Oakland street graph
        if: steps.graph-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: python street_graph.py
      # Save right away, so a later failing step does not throw away a
      # download that took minutes.
      - name: Save the packed street graph
        if: steps.graph-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/cache/oakland_walk.pkl.gz
          key: ${{ steps.graph-cache.outputs.cache-primary-key }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint, typecheck and test the frontend
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json
          npm test

      - name: Publish to Vercel
        run: |
          # Runtime settings for the backend function. Empty optional ones are
          # left out so the server falls back to its defaults.
          envs=(--env "MONGO_URI=$MONGO_URI" --env "SECRET_KEY=$SECRET_KEY" --env "CORS_ORIGINS=$SITE_URL")
          for name in GOOGLE_API_KEY SMTP_USER SMTP_PASSWORD GEMINI_MODEL; do
            if [ -n "${!name}" ]; then envs+=(--env "$name=${!name}"); fi
          done
          for attempt in 1 2 3; do
            if npx --yes vercel@63.1.0 deploy --prod --yes \
                --build-env VITE_API_URL=/api "${envs[@]}" > deploy-url.txt; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          echo "Deployment $(tail -n 1 deploy-url.txt)"
          echo "Live at $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the page loads
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$SITE_URL/" -o index.html \
                && grep -q '<div id="root">' index.html \
                && curl --fail --silent --max-time 20 -o /dev/null "$SITE_URL/login"; then
              echo "Frontend answered at $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL did not serve the app"
          exit 1
      - name: Ask the live backend for a route
        run: |
          # The first call after a deploy starts the function cold, which
          # loads the street graph and replays the crimes from MongoDB.
          url="$SITE_URL/api/safe_path?start_lat=37.8044&start_lon=-122.2712&end_lat=37.8100&end_lon=-122.2620&period=day"
          for attempt in 1 2 3; do
            status=$(curl --silent --max-time 300 -o route.json -w '%{http_code}' "$url" || true)
            points=$(python -c "import json; print(len(json.load(open('route.json')).get('route') or []))" 2>/dev/null || echo 0)
            echo "Attempt $attempt answered $status with $points route points"
            if [ "$status" = 200 ] && [ "$points" -ge 2 ]; then
              python -c "import json; print(json.load(open('route.json'))['summary'])"
              exit 0
            fi
            head -c 500 route.json || true
            sleep 20
          done
          echo "::error::The backend did not return a route"
          exit 1
      - name: Probe every live endpoint
        run: python .github/scripts/live_check.py "$SITE_URL"
