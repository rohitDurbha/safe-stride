name: Deploy backend

# Pushes the Flask backend to a free Hugging Face Docker Space whenever the
# backend changes on main, then waits until the Space answers on /home.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # The Vercel frontend and its preview deployments. Set the CORS_ORIGINS
      # repository variable to override it once the final domain is known.
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://safe-stride.vercel.app,https://safe-stride-[a-z0-9-]+\.vercel\.app$' }}
    outputs:
      url: ${{ steps.push.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt huggingface_hub
      - name: Run tests
        run: python -m pytest
      - name: Push to the Space
        id: push
        run: python deploy_space.py deploy
      - name: Wait for the Space to build and answer
        env:
          HF_SPACE_REPO_ID: ${{ steps.push.outputs.repo_id }}
        run: python deploy_space.py wait
      - name: Summary
        run: echo "Backend live at ${{ steps.push.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
